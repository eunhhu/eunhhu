<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#21262d" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="920" height="260" rx="14" fill="url(#bg)"/>
  <rect width="920" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="918.5" height="258.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top chrome bar -->
  <circle cx="28" cy="24" r="5" fill="#ff5f56" opacity="0.85"/>
  <circle cx="44" cy="24" r="5" fill="#ffbd2e" opacity="0.85"/>
  <circle cx="60" cy="24" r="5" fill="#27c93f" opacity="0.85"/>
  <text x="82" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#8b949e">eunhhu@systems ~ $ uname -m &amp;&amp; ./probe --verify-bounds</text>
  <line x1="0" y1="44" x2="920" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- Left column: Identity -->
  <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Sunwoo Moon</text>
  <rect x="36" y="100" width="64" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="36" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#79c0ff">SYSTEMS ARCHITECTURE · RUNTIME SECURITY · NATIVE TOOLING</text>

  <text x="36" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">Building local-first AI kernels, dynamic instrumentation workbenches,</text>
  <text x="36" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9">and container-native OS substrates with explicit trust boundaries.</text>

  <!-- Pills -->
  <g transform="translate(36, 200)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <rect x="0" y="0" width="148" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="14" cy="13" r="3.5" fill="#3fb950"/>
    <text x="25" y="17" fill="#e6edf3">DreamHack #28</text>

    <rect x="158" y="0" width="164" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="172" cy="13" r="3.5" fill="#58a6ff"/>
    <text x="183" y="17" fill="#e6edf3">frida/luma merged</text>

    <rect x="332" y="0" width="162" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="346" cy="13" r="3.5" fill="#d2a8ff"/>
    <text x="357" y="17" fill="#e6edf3">Rust · C · ARM64</text>
  </g>

  <!-- Right column: Architecture Stack Diagram -->
  <g transform="translate(560, 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="0" y="0" width="324" height="172" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="16" y="24" font-size="11" fill="#8b949e">// VERIFIED STACK &amp; SUBSTRATES</text>

    <!-- Layer 1 -->
    <rect x="16" y="36" width="292" height="34" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <text x="28" y="57" font-size="12" font-weight="600" fill="#7ee787">Agent Kernel</text>
    <text x="148" y="57" font-size="11" fill="#8b949e">ditto · event spine · caps</text>

    <!-- Layer 2 -->
    <rect x="16" y="78" width="292" height="34" rx="6" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
    <text x="28" y="99" font-size="12" font-weight="600" fill="#79c0ff">Instrumentation</text>
    <text x="148" y="99" font-size="11" fill="#8b949e">flab · vlitz · frida/luma</text>

    <!-- Layer 3 -->
    <rect x="16" y="120" width="292" height="34" rx="6" fill="#161b22" stroke="#8957e5" stroke-width="1"/>
    <text x="28" y="141" font-size="12" font-weight="600" fill="#d2a8ff">Runtime &amp; Input</text>
    <text x="148" y="141" font-size="11" fill="#8b949e">RexPlayer · spellwire · UDP</text>
  </g>
</svg>
